<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- URL มี token รีเซ็ตรหัสผ่าน: ห้ามส่ง Referer ไปเว็บอื่น (fonts/CDN) -->
  <meta name="referrer" content="no-referrer">
  <title data-i18n="resetPassword.title">ตั้งรหัสผ่านใหม่ - ระบบขอเอกสารออนไลน์</title>
  <!-- เพิ่มฟอนต์ Prompt สำหรับภาษาไทยและอังกฤษ -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- เพิ่มฟอนต์ Noto Sans SC สำหรับภาษาจีน -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#" data-i18n="navbar.title">ระบบขอเอกสารออนไลน์</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html" data-i18n="navbar.home">หน้าหลัก</a>
          </li>
        </ul>
        <div class="language-selector d-flex me-3">
          <button class="btn btn-sm btn-outline-light me-2" data-lang="th">ไทย</button>
          <button class="btn btn-sm btn-outline-light me-2" data-lang="en">English</button>
          <button class="btn btn-sm btn-outline-light" data-lang="zh">中文</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h3 class="mb-0" data-i18n="resetPassword.header">ตั้งรหัสผ่านใหม่</h3>
          </div>
          <div class="card-body">
            <div id="alert-container"></div>
            <div id="reset-checking" class="text-muted" data-i18n="resetPassword.checking">กำลังตรวจสอบลิงก์...</div>
            <form id="reset-password-form" style="display: none;">
              <div class="mb-3">
                <label class="form-label" data-i18n="resetPassword.studentId">รหัสนักศึกษา (ใช้เข้าสู่ระบบ)</label>
                <input type="text" class="form-control" id="reset-student-id" readonly>
              </div>
              <div class="mb-3">
                <label for="new-password" class="form-label required" data-i18n="resetPassword.newPassword">รหัสผ่านใหม่</label>
                <input type="password" class="form-control" id="new-password" required minlength="6" maxlength="100" autocomplete="new-password">
                <div class="form-text" data-i18n="resetPassword.passwordHint">อย่างน้อย 6 ตัวอักษร</div>
              </div>
              <div class="mb-3">
                <label for="confirm-password" class="form-label required" data-i18n="resetPassword.confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                <input type="password" class="form-control" id="confirm-password" required minlength="6" maxlength="100" autocomplete="new-password">
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="reset-submit" data-i18n="resetPassword.submit">บันทึกรหัสผ่านใหม่</button>
              </div>
            </form>
            <div class="mt-3 text-center">
              <a href="forgot-password.html" id="request-new-link" style="display: none;" data-i18n="resetPassword.requestNewLink">ขอลิงก์ใหม่</a>
              <a href="login.html" class="ms-3" data-i18n="forgotPassword.backToLogin">กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="footer mt-5 py-3 bg-light">
    <div class="container text-center">
      <span class="text-muted" data-i18n="footer.copyright">
        © 2025 ระบบขอเอกสารการศึกษาออนไลน์ สำหรับนักศึกษามหาวิทยาลัยนอร์ทกรุงเทพ
      </span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/language.js?v=20260928f"></script>
  <script src="js/main.js?v=20260928f"></script>
  <script src="js/password-reset.js?v=20260928f"></script>
</body>
</html>
